# QuickBite CI/CD on GitHub Actions (second CI server, alongside Jenkins).
# Every push / PR to main runs: build -> lint -> test -> Maven -> security scans
# -> Docker build -> Trivy scan -> deploy to an ephemeral Kubernetes (kind) cluster
# -> smoke test + metrics check. Fully end-to-end, no cloud bill.
name: QuickBite CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: quickbite:1.0.${{ github.run_number }}

jobs:
  build-test:
    name: Build, Lint & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/coverage

  maven:
    name: Maven build (menu-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B clean package
        working-directory: menu-service

  security:
    name: DevSecOps scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (fail on high)
        working-directory: app
        run: npm ci && npm audit --omit=dev --audit-level=high
      - name: Gitleaks secret scan
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact -v --exit-code 1

  docker-deploy:
    name: Containerize, Scan & Deploy to K8s
    runs-on: ubuntu-latest
    needs: [build-test, maven, security]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg APP_VERSION=1.0.${{ github.run_number }} -t $IMAGE app

      - name: Install Trivy
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y -qq trivy

      - name: Trivy image scan (fail on fixable CRITICAL)
        run: trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress $IMAGE

      - name: Create Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: quickbite

      - name: Load image into cluster
        run: kind load docker-image $IMAGE --name quickbite

      - name: Deploy (rolling update)
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml -f k8s/service.yaml
          sed "s|image: quickbite:latest|image: $IMAGE|" k8s/deployment.yaml | kubectl apply -f -
          kubectl -n quickbite rollout status deployment/quickbite --timeout=180s
          kubectl -n quickbite get pods -o wide

      - name: Smoke test + metrics check
        run: |
          kubectl -n quickbite port-forward svc/quickbite 8080:80 &
          sleep 5
          curl -sf http://localhost:8080/health
          curl -sf -X POST http://localhost:8080/api/orders \
            -H 'Content-Type: application/json' \
            -d '{"studentName":"CI Bot","items":[{"itemId":1,"qty":2}]}'
          curl -sf http://localhost:8080/metrics | grep quickbite_orders_placed_total

      - name: Rollback on failure
        if: failure()
        run: kubectl -n quickbite rollout undo deployment/quickbite || true
