# Grafana auto-loads this dashboard (sidecar watches label grafana_dashboard=1)
apiVersion: v1
kind: ConfigMap
metadata:
  name: quickbite-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  quickbite-sre.json: |-
    {
      "uid": "quickbite-sre",
      "title": "QuickBite - SRE Overview",
      "tags": [
        "quickbite",
        "sre"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "ds_prom",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "current": {}
          },
          {
            "name": "ds_loki",
            "label": "Loki",
            "type": "datasource",
            "query": "loki",
            "current": {}
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 100,
          "type": "row",
          "title": "SLO overview (SLO: 99.5% availability, p95 < 300 ms)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 1,
          "title": "Availability (5m)",
          "type": "stat",
          "description": "SLI: share of non-5xx API responses. SLO target 99.5%",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "expr": "quickbite:availability:rate5m",
              "legendFormat": "",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.99
                  },
                  {
                    "color": "green",
                    "value": 0.995
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background"
          }
        },
        {
          "id": 2,
          "title": "p95 order latency",
          "type": "stat",
          "description": "SLI: 95th percentile latency of POST /api/orders. SLO < 300 ms",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "x": 6,
            "y": 1,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "expr": "quickbite:order_latency_p95:rate5m",
              "legendFormat": "",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.25
                  },
                  {
                    "color": "red",
                    "value": 0.3
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background"
          }
        },
        {
          "id": 3,
          "title": "Error budget remaining (1h window)",
          "type": "stat",
          "description": "Error budget = 0.5% of requests. 100% means no budget used.",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "expr": "clamp_min(1 - (quickbite:error_ratio:rate1h / 0.005), 0)",
              "legendFormat": "",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.25
                  },
                  {
                    "color": "green",
                    "value": 0.5
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background"
          }
        },
        {
          "id": 4,
          "title": "Firing alerts",
          "type": "stat",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "x": 18,
            "y": 1,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "expr": "count(ALERTS{alertstate=\"firing\", alertname=~\"QuickBite.*\"}) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background"
          }
        },
        {
          "id": 101,
          "type": "row",
          "title": "Golden signals",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 5,
          "title": "Traffic: requests/sec by route",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum by (route) (rate(http_requests_total{namespace=\"quickbite\"}[1m]))",
              "legendFormat": "{{route}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 6,
          "title": "Errors: 5xx error ratio vs 2% alert line",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "x": 12,
            "y": 7,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "quickbite:error_ratio:rate5m",
              "legendFormat": "error ratio",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            },
            {
              "expr": "vector(0.02)",
              "legendFormat": "alert threshold (2%)",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            },
            {
              "expr": "vector(0.005)",
              "legendFormat": "SLO budget (0.5%)",
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 7,
          "title": "Latency: p50 / p95 / p99 of POST /api/orders",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"quickbite\",route=\"/api/orders\",method=\"POST\"}[1m])))",
              "legendFormat": "p50",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"quickbite\",route=\"/api/orders\",method=\"POST\"}[1m])))",
              "legendFormat": "p95",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"quickbite\",route=\"/api/orders\",method=\"POST\"}[1m])))",
              "legendFormat": "p99",
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            },
            {
              "expr": "vector(0.3)",
              "legendFormat": "SLO (300 ms)",
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 8,
          "title": "Saturation: CPU per pod",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "x": 12,
            "y": 15,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"quickbite\",container=\"quickbite\"}[1m]))",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 102,
          "type": "row",
          "title": "Business + Kubernetes",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 23,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 9,
          "title": "Orders placed per minute",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "expr": "sum(rate(quickbite_orders_placed_total{namespace=\"quickbite\"}[1m])) * 60",
              "legendFormat": "orders/min",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 10,
          "title": "Active orders (by pod)",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "x": 8,
            "y": 24,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "expr": "quickbite_active_orders{namespace=\"quickbite\"}",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 11,
          "title": "Running pods (HPA scaling)",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "x": 16,
            "y": 24,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "expr": "count(up{namespace=\"quickbite\",job=\"quickbite\"} == 1)",
              "legendFormat": "pods up",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            },
            {
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"quickbite\"}",
              "legendFormat": "HPA desired",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 12,
          "title": "Requests by track (stable vs canary)",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "x": 0,
            "y": 31,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum by (track, status_code) (rate(http_requests_total{namespace=\"quickbite\",route=~\"/api/.*\"}[1m]))",
              "legendFormat": "{{track}} {{status_code}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 13,
          "title": "Application logs (Loki)",
          "type": "logs",
          "description": "",
          "datasource": {
            "type": "loki",
            "uid": "${ds_loki}"
          },
          "gridPos": {
            "x": 12,
            "y": 31,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "{namespace=\"quickbite\"} | json",
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${ds_loki}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          }
        },
        {
          "id": 14,
          "title": "Error logs only",
          "type": "logs",
          "description": "",
          "datasource": {
            "type": "loki",
            "uid": "${ds_loki}"
          },
          "gridPos": {
            "x": 0,
            "y": 39,
            "w": 24,
            "h": 7
          },
          "targets": [
            {
              "expr": "{namespace=\"quickbite\"} | json | level=\"error\"",
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${ds_loki}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          }
        }
      ]
    }
