<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickBite Canteen</title>
<style>
  :root { --bg:#fbf7f2; --card:#fff; --ink:#2b2118; --muted:#7a6a5c; --accent:#d9480f; --line:#eadfd3; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:20px 16px; border-bottom:1px solid var(--line); background:var(--card); }
  header h1 { margin:0; font-size:22px; } header h1 span { color:var(--accent); }
  header p { margin:4px 0 0; color:var(--muted); font-size:14px; }
  main { max-width:760px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  h2 { margin:0 0 12px; font-size:16px; }
  .item { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px dashed var(--line); }
  .item:last-child { border-bottom:none; }
  .sold { color:var(--muted); text-decoration:line-through; }
  input[type=number] { width:56px; padding:4px; }
  input[type=text] { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; }
  button { background:var(--accent); color:#fff; border:none; padding:10px 16px; border-radius:6px; font-weight:600; cursor:pointer; margin-top:12px; }
  #result { margin-top:12px; font-weight:600; }
  .version { font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Quick<span>Bite</span> Canteen</h1>
  <p>Pre-order before the 1 pm rush. Collect with your token. <span class="version" id="ver"></span></p>
</header>
<main>
  <section class="card">
    <h2>Menu</h2>
    <div id="menu">Loading…</div>
  </section>
  <section class="card">
    <h2>Place order</h2>
    <input type="text" id="name" placeholder="Your name">
    <button id="order">Place order</button>
    <div id="result"></div>
  </section>
</main>
<script>
  const menuEl = document.getElementById('menu');
  fetch('/health').then(r => r.json()).then(h => { document.getElementById('ver').textContent = 'v' + h.version; });
  fetch('/api/menu').then(r => r.json()).then(items => {
    menuEl.innerHTML = items.map(m => `
      <div class="item">
        <span class="${m.available ? '' : 'sold'}">${m.name} — ₹${m.price}</span>
        ${m.available ? `<input type="number" min="0" max="10" value="0" data-id="${m.id}">` : '<em>Sold out</em>'}
      </div>`).join('');
  });
  document.getElementById('order').onclick = async () => {
    const items = [...document.querySelectorAll('input[type=number]')]
      .filter(i => Number(i.value) > 0)
      .map(i => ({ itemId: Number(i.dataset.id), qty: Number(i.value) }));
    const res = await fetch('/api/orders', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ studentName: document.getElementById('name').value, items })
    });
    const data = await res.json();
    document.getElementById('result').textContent = res.ok
      ? `Order placed! Token #${data.token} · Total ₹${data.total}`
      : `Error: ${data.error}`;
  };
</script>
</body>
</html>
