# Runtime configuration for QuickBite.
# CHAOS_* values are used ONLY for the SRE incident demo (see sre/incident-demo.md).
# Normal operation: both must be "0".
apiVersion: v1
kind: ConfigMap
metadata:
  name: quickbite-config
  namespace: quickbite
data:
  PORT: "3000"
  CHAOS_DELAY_MS: "0"
  CHAOS_ERROR_RATE: "0"
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "quickbite"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger.observability:4318"
