apiVersion: v1
kind: Service
metadata:
  name: quickbite
  namespace: quickbite
  labels:
    app: quickbite                  # matched by the Prometheus ServiceMonitor
spec:
  type: NodePort
  selector:
    app: quickbite                  # matches both stable and canary pods
  ports:
    - name: http                    # port name used by the ServiceMonitor
      port: 80
      targetPort: http
      nodePort: 30080
