# Horizontal Pod Autoscaler: absorbs the 1 pm lunch rush by adding pods.
# Requires metrics-server (minikube addons enable metrics-server).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quickbite
  namespace: quickbite
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quickbite
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
